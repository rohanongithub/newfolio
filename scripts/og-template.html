<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: 'Bricolage Grotesque'; src: url('{{fonts}}/Bricolage-Grotesque-Variable.woff2') format('woff2'); font-weight: 200 800; font-stretch: 75% 100%; }
      @font-face { font-family: 'Hanken Grotesk'; src: url('{{fonts}}/Hanken-Grotesk-Variable.woff2') format('woff2'); font-weight: 100 900; }
      @font-face { font-family: 'JetBrains Mono'; src: url('{{fonts}}/JetBrains-Mono-Variable.woff2') format('woff2'); font-weight: 100 800; }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body { background: hsl(232 91% 55%); color: #fff; font-family: 'Hanken Grotesk', sans-serif; position: relative; }
      .brand { position: absolute; left: 80px; top: 64px; display: flex; align-items: center; gap: 18px; font: 700 34px 'Bricolage Grotesque', sans-serif; letter-spacing: -0.01em; }
      .tile { width: 56px; height: 56px; border-radius: 12px; background: #fff; color: hsl(232 91% 55%); display: grid; place-items: center; font: 800 40px/1 'Bricolage Grotesque', sans-serif; }
      .kind { position: absolute; right: 80px; top: 78px; font: 500 26px 'JetBrains Mono', monospace; color: hsl(232 100% 92%); }
      .name { position: absolute; left: 80px; right: 80px; top: 190px; font: 800 {{nameSize}}px/0.95 'Bricolage Grotesque', sans-serif; letter-spacing: -0.025em; }
      .facts { position: absolute; left: 80px; top: 372px; font: 500 34px 'JetBrains Mono', monospace; color: hsl(232 100% 92%); display: flex; align-items: center; gap: 18px; }
      .status { background: hsl(44 100% 82%); color: hsl(36 100% 16%); font: 700 26px 'Hanken Grotesk', sans-serif; padding: 6px 18px; border-radius: 8px; }
      .tags { position: absolute; left: 80px; right: 80px; bottom: 64px; display: flex; flex-wrap: wrap; gap: 14px; }
      .tag { background: rgba(255, 255, 255, 0.15); font: 500 28px 'Hanken Grotesk', sans-serif; padding: 8px 20px; border-radius: 8px; }
    </style>
  </head>
  <body>
    <div class="brand"><div class="tile">R</div>rohandev</div>
    <div class="kind">project</div>
    <div class="name">{{name}}</div>
    <div class="facts">{{facts}}{{status}}</div>
    <div class="tags">{{tags}}</div>
  </body>
</html>
